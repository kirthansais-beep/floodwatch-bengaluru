<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}input[type=range]{accent-color:var(--ac)}.card[style*="border-top"],.card[style*="border-left:8px"]{border:1px solid var(--bd)!important}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
aside{background:var(--nav);color:#c9d3d1;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid #00000033}
.logo{font-size:18px;font-weight:700;color:#fff;padding:2px 10px 16px;border-bottom:1px solid #ffffff1f;margin-bottom:10px}.logo small{display:block;font-size:10px;font-weight:500;color:#8fa6a3;letter-spacing:.1em;margin-top:2px}

aside a:hover{background:#ffffff10}aside a.on{background:#ffffff14;border-left-color:#e0a63a;color:#fff}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top input{width:190px}.grow{flex:1}
#view{padding:18px;display:grid;gap:16px}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0}h2{font-size:15px;font-weight:600;margin:0 0 10px;color:var(--tx)}.st{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}.st i{width:9px;height:9px;border-radius:50%;display:inline-block}
.sub{color:var(--mu);margin:2px 0 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi{}.kpi b{display:block;font-size:28px;line-height:1.15;font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600}.kpi span{color:var(--mu);font-size:13px}
.pill{display:inline-block;padding:2px 8px;border-radius:3px;color:#fff;font-weight:600;font-size:11px;letter-spacing:.03em;text-transform:uppercase}
svg{width:100%;height:auto;display:block;border-radius:4px;background:var(--map)}
button,select,input{font:inherit}button,select{padding:7px 12px;border-radius:4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-weight:500}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.on{background:var(--ac2);border-color:var(--ac2);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.bar{height:6px;background:var(--bd);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;border-radius:2px}
.zr{padding:10px 0;border-bottom:1px solid var(--bd)}.zr:last-child{border:0}
.al{padding:10px;border-radius:4px;border-left:4px solid var(--o);background:var(--bg);margin-bottom:10px;font-size:14px}
.mu{color:var(--mu);font-size:13px}.wide{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-size:12px;text-transform:uppercase}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow-x:auto;padding:8px}.logo{display:none}aside a{white-space:nowrap}}
</style></head><body>

kn:{w:(a,m,v,r)=>`⚠️ ಪ್ರವಾಹ ಎಚ್ಚರಿಕೆ: ${a}. ಸುಮಾರು ${m} ನಿಮಿಷಗಳಲ್ಲಿ ನೀರು ನಿಲ್ಲುವ ಸಾಧ್ಯತೆ. ${v} ತಪ್ಪಿಸಿ. ಪರ್ಯಾಯ ಮಾರ್ಗ: ${r}.`,s:a=>`🚨 ತೀವ್ರ ಪ್ರವಾಹ ಅಪಾಯ: ${a}. ವಾಹನ ಮತ್ತು ಬೆಲೆಬಾಳುವ ವಸ್ತುಗಳನ್ನು ಎತ್ತರದ ಜಾಗಕ್ಕೆ ಸರಿಸಿ. ತುರ್ತು: 112.`}};
const SB=[.34,.30,.24,.20,.12,.09,.18,.08,.10,.16,.26,.14,.11],DP=[210,180,160,150,140,120,130,110,125,135,170,115,105],CA=[420,310,380,260,230,340,200,150,220,260,360,180,140],SN=Array.from({length:13},(_,i)=>'BLR-S'+String(i+1).padStart(2,'0')),ST=['Lake outflow channel','Storm drain','Underpass sump','Valley storm drain','Lake inflow channel','Road-side drain','Underpass sump','Storm drain','Lake inflow channel','Bridge-level gauge','Road-side drain','Storm drain','Storm drain'],MEAN={Rainfall:'How hard it rains compared with 80 mm/hr (cloudburst level)',Terrain:'How low the ground is. Low areas collect water',Drain:'How full the local drain or lake sensor is',Reports:'Citizen reports of blocked drains or waterlogging (4 or more = maximum)',History:'How often this spot flooded in past monsoons'};

const zh=Z.map(()=>[0]);
const now=()=>new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

const $=id=>document.getElementById(id);
function bkNow(i){return Math.min(.95,BK[i]+rain/100*BKI[EN[i]]+(sc==='drain'?.2:0))}
function calc(z,i){const sw=W.r+W.e+W.d+W.p+W.h,R=Math.min(rain/80*(sc==='cloud'?1.3:1),1),D=Math.min(1,SB[i]+R*(1.15-z.c+bkNow(i)*.6)*.9+Math.sin(i*7.3+rain*.2)*.02),n=reps.filter(r=>r.z===i).length,P=Math.min(n/4,1),k=.15+.85*R;
const parts={Rainfall:W.r/sw*R,Terrain:W.e/sw*z.e*k,Drain:W.d/sw*D*k,Reports:W.p/sw*P*(.4+.6*R),History:W.h/sw*z.h*k},risk=Math.min(1,Object.values(parts).reduce((a,b)=>a+b,0)+(sc==='lake'&&z.e>=.75?.12*R:0));

if(lay.z){const rk=s.map((q,i)=>i).sort((a,b)=>s[b].risk-s[a].risk);Z.forEach((z,i)=>{const q=s[i],r0=24+q.risk*24,c=L[q.l][1],o=rk.indexOf(i);m+=`<g data-z="${i}" style="cursor:pointer">${q.l>=2?`<circle cx="${z.x}" cy="${z.y}" r="${r0}" fill="none" stroke="${c}" stroke-width="3"><animate attributeName="r" values="${r0};${r0+26}" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="1.6s" repeatCount="indefinite"/></circle>`:''}<circle cx="${z.x}" cy="${z.y}" r="${r0}" fill="${c}" opacity=".65" stroke="${i===sel&&click?'var(--tx)':c}" stroke-width="${i===sel&&click?4:2}"/><text x="${z.x}" y="${z.y+4}" font-size="12" font-weight="800" text-anchor="middle" fill="#fff" stroke="#000a" stroke-width="3" paint-order="stroke">${z.n}</text>${o<3&&q.l>=1?`<circle cx="${z.x+r0*.75}" cy="${z.y-r0*.75}" r="11" fill="var(--r)" stroke="#fff" stroke-width="2"/><text x="${z.x+r0*.75}" y="${z.y-r0*.75+4}" font-size="12" font-weight="800" text-anchor="middle" fill="#fff">${o+1}</text>`:''}</g>`})}
if(lay.r)reps.forEach(r=>m+=`<text x="${r.x-8}" y="${r.y+6}" font-size="18">📍</text>`);
if(lay.v){const c={};VP.forEach(v=>{const z=Z[v[2]],k=c[v[2]]=(c[v[2]]||0)+1;m+=`<text x="${z.x-34+k*17}" y="${z.y-54}" font-size="16">${v[0]}</text>`})}
return `<svg viewBox="0 0 800 480" id="msv">${m}</svg>`}
const pages={
overview(){const s=S(),mx=Math.max(...s.map(q=>q.risk)),w=s.filter(q=>q.l>=2).length;
return `<div><h1>Overview</h1><p class="sub">Floods hurt because rainfall, blocked drains and weak monitoring are never connected. FloodWatch joins them to find vulnerable locations and warn people early.</p></div><div class="card"><h2>How it works · live</h2><div class="grid">${kpi('1 · Rainfall data',rain+' mm/hr','var(--ac)')}${kpi('2 · Water-level sensors',Math.round(s.reduce((a,q)=>a+q.drain,0)/s.length*100)+'% avg drain','var(--ac2)')}${kpi('3 · Drainage reports',reps.length+' reports','var(--o)')}${kpi('4 · Geographic risk map',Z.length+' zones','#7a6a9a')}</div><p style="margin:12px 0 0"><b>→ Risk engine →</b> ${w} vulnerable locations <b>→</b> ${log.length} early warnings sent · scenario: ${SCN[sc]}</p></div>
<div class="grid">${kpi('Rainfall',rain+' mm/hr','var(--ac)')}${kpi('Highest risk',mx.toFixed(2),L[lvl(mx)][1])}${kpi('Zones at Warning+',w+' / '+Z.length,'var(--o)')}${kpi('Citizen reports',reps.length,'var(--ac2)')}${kpi('Alerts sent',log.length,'var(--r)')}</div>
<div class="grid two"><div class="card"><h2>City risk trend</h2>${spark(zh.map((_,t)=>0).length?cityHist():[0],'var(--ac)',90)}</div>
<div class="card"><h2>Zone status</h2>${s.map((q,i)=>`<div class="zr"><div class="row sp"><b>${Z[i].n}</b>${pill(q.l)}</div>${bar(q.risk,L[q.l][1])}</div>`).join('')}</div></div>`},

return `<div><h1>Risk Map</h1><p class="sub">Most vulnerable areas during a flood event. Pick a calamity scenario at the top, then click a zone to inspect it. Red numbered badges mark the 3 most vulnerable zones.</p></div>

<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))"><div class="card" style="grid-column:span 1">${mapSvg(s,1)}<div class="row mu" style="margin-top:8px">${pill(0)}${pill(1)}${pill(2)}${pill(3)}<span>📍 citizen report</span><span>🏥🏫🚇 critical places</span></div><h2 style="margin-top:14px">Most vulnerable now · ${SCN[sc]}</h2>${s.map((q,i)=>({q,i})).sort((a,b)=>b.q.risk-a.q.risk).slice(0,3).map(({q,i},r)=>`<div class="row sp zr"><b>${r+1}. ${Z[i].n}</b><span>${q.risk.toFixed(2)} ${pill(q.l)}</span></div>`).join('')}</div>
<div class="card"><h2>${z.n} · ${pill(q.l)}</h2><b style="font-size:32px">${q.risk.toFixed(2)}</b><span class="mu"> risk score</span>
<p>${q.l>1?'Flooding likely in about <b>'+q.eta+' min</b>.':'No flooding expected right now.'} Population exposed: ${z.pop}.</p>
<h2>Why this score</h2><p class="mu">Score (0 to 1) = Rainfall 35% + Terrain 25% + Drain 20% + Reports 10% + History 10%. Rainfall has the biggest weight (0.35) because it triggers floods. Each bar is that factor’s share of this zone’s score. </p>${Object.entries(q.parts).map(([k,v])=>`<div class="row sp mu"><span>${k}</span><span>${v.toFixed(2)}</span></div>${bar(v/.35,PC[k])}`).join('')}</div></div>`},

return `<div><h1>Authority View</h1><p class="sub">Top 5 risky zones with an action checklist for field teams.</p></div><div class="card"><h2>What is this page?</h2><p>The control-room screen for the municipal corporation and disaster-response teams. Without it, officials would check rainfall, sensors and complaints separately.</p><ol style="margin:0;padding-left:20px"><li><b>Prioritise:</b> zones are ranked by risk, so pumps, crews and traffic police go to the worst places first.</li><li><b>Decide:</b> each zone shows drain fill, citizen reports and time-to-flood (ETA).</li><li><b>Act and track:</b> the checklist records which actions are done (clear drain, deploy pump, divert traffic, notify residents).</li></ol></div>`+top.map(({q,i},r)=>`<div class="card" style="border-left:8px solid ${L[q.l][1]}"><div class="row sp"><h1 style="font-size:20px">#${r+1} ${Z[i].n}</h1>${pill(q.l)}</div>
